# picopg.cn -> 静态站点 + 本地应用（127.0.0.1:8001）
#
# 80 跳 HTTPS。443 下只有 /api/ 和 /healthz 交给应用，其余从 /var/www/picopg 取文件：
# 站点和接口同源，浏览器不需要任何 CORS 头。
#
# 站点文件就是 `npm run build` 的 `dist/`，原样放进去 —— 课程页用 `../libs/`、
# `../pico.js`、`../pyodide/` 取运行时，所以 `dist/` 的内容就是这个 root 的内容。

server {
    listen 80;
    listen [::]:80;

    server_name picopg.cn www.picopg.cn;

    access_log /var/log/nginx/picopg.access.log;
    error_log  /var/log/nginx/picopg.error.log;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name picopg.cn www.picopg.cn;

    access_log /var/log/nginx/picopg.access.log;
    error_log  /var/log/nginx/picopg.error.log;

    ssl_certificate /etc/letsencrypt/live/picopg.cn/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/picopg.cn/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    root /var/www/picopg;
    index index.html;

    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
    add_header X-Content-Type-Options nosniff always;

    # .pico 包走 /api/ 上传。nginx 默认 1 MiB，超了会在到达应用之前先回 413 ——
    # 应用那边的限额检查根本轮不上，报错里也看不到应用的话。
    # v1 portable profile 的 packageBytes 是 72 MiB，这里必须放行完整上限。
    client_max_body_size 80m;

    # SSE 必须单独关闭响应缓冲；否则通知可能被 nginx 攒成一批，客户端看似在线却不更新。
    location = /api/v1/replica/events {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering no always;
        proxy_read_timeout 1h;
        proxy_send_timeout 300s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 健康检查也是应用提供的，不转发就会落到静态目录变成 404。
    location = /healthz {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # 其余全是构建产物。文件不在就是 404，不做 SPA 兜底：
    # 一门课就是一个目录页，没有前端路由。
    location / {
        try_files $uri $uri/ =404;
    }
}
