[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "picopg"
version = "0.1.0"
description = "PicoPG server core contracts and adapters"
requires-python = ">=3.11"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]

[tool.pytest.ini_options]
# 只收集本仓库的测试：upstream-repos/ 是参考用的第三方仓库，不是这里的测试。
testpaths = ["tests"]
pythonpath = ["src", "."]
